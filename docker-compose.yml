services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ytbot
      POSTGRES_USER: ytbot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ytbot -d ytbot"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - database

  download-init:
    image: alpine:3.22
    user: "0:0"
    command: ["sh", "-c", "mkdir -p /downloads && chown 10001:10001 /downloads && chmod 0755 /downloads"]
    volumes:
      - download-store:/downloads
    restart: "no"

  pot-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:2.0.2
    restart: unless-stopped
    init: true
    networks:
      - app

  downloads-nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./deploy/nginx-download.conf:/etc/nginx/conf.d/default.conf:ro
      - download-store:/usr/share/nginx/html/downloads:ro
    depends_on:
      download-init:
        condition: service_completed_successfully
    networks:
      - app

  bot:
    build: .
    image: youtube-fa-subtitle-bot:local
    restart: unless-stopped
    init: true
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      ALLOWED_USER_IDS: ${ALLOWED_USER_IDS:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_ADMIN_KEY: ${OPENAI_ADMIN_KEY:-}
      OPENAI_PROJECT_ID: ${OPENAI_PROJECT_ID:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-6-luna}
      OPENROUTER_TRANSCRIPTION_MODEL: ${OPENROUTER_TRANSCRIPTION_MODEL:-openai/whisper-1}
      OPENROUTER_TTS_MODEL: ${OPENROUTER_TTS_MODEL:-google/gemini-3.8-flash-lite-tts}
      OPENROUTER_TTS_VOICE: ${OPENROUTER_TTS_VOICE:-Kore}
      OPENROUTER_RPM_LIMIT: ${OPENROUTER_RPM_LIMIT:-10}
      OPENROUTER_MAX_RETRIES: ${OPENROUTER_MAX_RETRIES:-8}
      DEFAULT_API_PROVIDER: ${DEFAULT_API_PROVIDER:-}
      PROVIDER_CONTROL_USER_ID: ${PROVIDER_CONTROL_USER_ID:-}
      TRANSLATION_MODEL: ${TRANSLATION_MODEL:-gpt-6-luna}
      WHISPER_MODEL: ${WHISPER_MODEL:-whisper-1}
      VIDEO_MAX_MINUTES: ${VIDEO_MAX_MINUTES:-60}
      VIDEO_MAX_HEIGHT: ${VIDEO_MAX_HEIGHT:-720}
      MAX_FILE_BYTES: ${MAX_FILE_BYTES:-1000000000}
      WORK_DIR: /data
      YOUTUBE_COOKIES_FILE: ${YOUTUBE_COOKIES_FILE:-}
      INSTAGRAM_COOKIES_FILE: ${INSTAGRAM_COOKIES_FILE:-}
      YTDLP_POT_BASE_URL: ${YTDLP_POT_BASE_URL:-http://pot-provider:4416}
      DOWNLOAD_DIR: /downloads
      DOWNLOAD_BASE_URL: ${DOWNLOAD_BASE_URL:-}
      DOWNLOAD_TTL_HOURS: ${DOWNLOAD_TTL_HOURS:-24}
      TTS_MODEL: ${TTS_MODEL:-gpt-realtime-2.1-mini}
      TTS_VOICE: ${TTS_VOICE:-marin}
      WATERMARK_TEXT: ${WATERMARK_TEXT:-}
      DEFAULT_SUBTITLE_PRICE_TOMAN_PER_MINUTE: ${DEFAULT_SUBTITLE_PRICE_TOMAN_PER_MINUTE:-5000}
      DEFAULT_DUB_PRICE_TOMAN_PER_MINUTE: ${DEFAULT_DUB_PRICE_TOMAN_PER_MINUTE:-10000}
      CARD_TO_CARD_NUMBER: ${CARD_TO_CARD_NUMBER:-}
      CARD_TO_CARD_HOLDER: ${CARD_TO_CARD_HOLDER:-}
      MINIMUM_WALLET_TOPUP_TOMAN: ${MINIMUM_WALLET_TOPUP_TOMAN:-50000}
      SUPPORT_USERNAME: ${SUPPORT_USERNAME:-}
      DATABASE_URL: postgresql+asyncpg://ytbot:${POSTGRES_PASSWORD}@database:5432/ytbot
    volumes:
      - workdata:/data
      - download-store:/downloads
      - ./secrets:/run/secrets:ro
    stop_grace_period: 30s
    depends_on:
      database:
        condition: service_healthy
      pot-provider:
        condition: service_started
      download-init:
        condition: service_completed_successfully
    networks:
      - app
      - database

volumes:
  workdata:
  download-store:
  postgres-data:

networks:
  app:
    driver: bridge
  database:
    internal: true
