services:
  db-credential-init:
    image: alpine:3.22
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        umask 077;
        if [ ! -s /state/postgres_password ]; then
          if [ -s /legacy/postgres_password ]; then
            cp /legacy/postgres_password /state/postgres_password;
          elif [ -n "$$LEGACY_POSTGRES_PASSWORD" ]; then
            printf '%s' "$$LEGACY_POSTGRES_PASSWORD" > /state/postgres_password;
          else
            head -c 48 /dev/urandom | base64 | tr -d '\n' > /state/postgres_password;
          fi;
          chmod 0444 /state/postgres_password;
        fi;
        if [ ! -s /control/domain_manager_token ]; then
          head -c 48 /dev/urandom | base64 | tr -d '\n' > /control/domain_manager_token;
          chmod 0444 /control/domain_manager_token;
        fi
    environment:
      LEGACY_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - database-secret:/state
      - domain-control-secret:/control
      - ./secrets:/legacy:ro
    restart: "no"

  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ytbot
      POSTGRES_USER: ytbot
      POSTGRES_PASSWORD_FILE: /run/database-secret/postgres_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - database-secret:/run/database-secret:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ytbot -d ytbot"]
      interval: 5s
      timeout: 5s
      retries: 12
    depends_on:
      db-credential-init:
        condition: service_completed_successfully
    networks:
      - database

  download-init:
    image: alpine:3.22
    user: "0:0"
    command: ["sh", "-c", "mkdir -p /downloads && chown 10001:10001 /downloads && chmod 0755 /downloads"]
    volumes:
      - download-store:/downloads
    restart: "no"

  pot-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:2.0.2
    restart: unless-stopped
    init: true
    networks:
      - app

  downloads-nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./deploy/nginx-download.conf:/etc/nginx/conf.d/default.conf:ro
      - download-store:/usr/share/nginx/html/downloads:ro
    depends_on:
      download-init:
        condition: service_completed_successfully
    networks:
      - app

  separator-init:
    image: alpine:3.22
    user: "0:0"
    command: ["sh", "-c", "mkdir -p /models /data && chown 10001:10001 /models /data"]
    volumes:
      - separator-models:/models
      - workdata:/data
    restart: "no"

  dub-separator:
    build:
      context: .
      dockerfile: Dockerfile.separator
    restart: unless-stopped
    init: true
    volumes:
      - workdata:/data
      - separator-models:/models
    depends_on:
      separator-init:
        condition: service_completed_successfully
    networks:
      - app

  domain-manager:
    build: .
    image: youtube-fa-subtitle-bot:local
    command: ["python", "-m", "app.domain_manager"]
    user: "0:0"
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      DOMAIN_MANAGER_TOKEN_FILE: /run/domain-control/domain_manager_token
      CADDY_CONFIG_DIR: /shared-caddy-config
      DOMAIN_MANAGER_PORT: "8088"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - domain-control-secret:/run/domain-control:ro
      - caddy-config:/shared-caddy-config
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8088/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
    depends_on:
      db-credential-init:
        condition: service_completed_successfully
      downloads-nginx:
        condition: service_started
    networks:
      - domain-control

  bot:
    build: .
    image: youtube-fa-subtitle-bot:local
    restart: unless-stopped
    init: true
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?Set TELEGRAM_BOT_TOKEN in .env}
      ADMIN_USER_ID: ${ADMIN_USER_ID:?Set ADMIN_USER_ID in .env}
      WORK_DIR: /data
      DOWNLOAD_DIR: /downloads
      DUB_SEPARATOR_URL: http://dub-separator:8090
      YTDLP_POT_BASE_URL: http://pot-provider:4416
    volumes:
      - workdata:/data
      - download-store:/downloads
      - database-secret:/run/database-secret:ro
      - domain-control-secret:/run/domain-control:ro
      - ./secrets:/run/secrets:ro
    stop_grace_period: 30s
    depends_on:
      db-credential-init:
        condition: service_completed_successfully
      database:
        condition: service_healthy
      pot-provider:
        condition: service_started
      download-init:
        condition: service_completed_successfully
      domain-manager:
        condition: service_healthy
    networks:
      - app
      - database
      - domain-control

volumes:
  workdata:
  download-store:
  postgres-data:
  separator-models:
  database-secret:
  domain-control-secret:
  caddy-config:
  caddy-data:
  caddy-runtime:

networks:
  app:
    driver: bridge
  database:
    internal: true
  domain-control:
    internal: true
