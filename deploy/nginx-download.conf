server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html/downloads;
    autoindex off;
    access_log off;
    sendfile on;

    # A token-only URL serves a small static player page. The page can only
    # reference assets bearing the same random 128-bit token.
    location ~ "^/(?<token>[a-f0-9]{32})$" {
        limit_except GET HEAD {
            deny all;
        }
        try_files /$token.html =404;
        default_type text/html;
        charset utf-8;
        add_header Content-Security-Policy "default-src 'self'; style-src 'unsafe-inline'; media-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Cache-Control "private, no-store" always;
    }

    location ~ "^/[a-f0-9]{32}\.mp4$" {
        limit_except GET HEAD {
            deny all;
        }
        try_files $uri =404;
        default_type video/mp4;
        add_header Content-Disposition "inline" always;
        add_header Accept-Ranges "bytes" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Cache-Control "private, no-store" always;
    }

    location ~ "^/[a-f0-9]{32}\.vtt$" {
        limit_except GET HEAD {
            deny all;
        }
        try_files $uri =404;
        default_type text/vtt;
        charset utf-8;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Cache-Control "private, no-store" always;
    }

    location ~ "^/[a-f0-9]{32}\.srt$" {
        limit_except GET HEAD {
            deny all;
        }
        try_files $uri =404;
        default_type application/x-subrip;
        charset utf-8;
        add_header Content-Disposition "attachment" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Cache-Control "private, no-store" always;
    }

    location / {
        return 404;
    }
}
